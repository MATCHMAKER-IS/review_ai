version: 1
frontend:
  phases:
    preBuild:
      commands:
        # ── 診断 ──────────────────────────────
        # ビルドが「app ディレクトリが無い」で落ちた場合、
        # ここの出力で何がリポジトリに入っているか確認できます。
        # 問題が解決したらこの3行は消して構いません。
        - echo "--- working dir ---" && pwd
        - echo "--- root files ---" && ls -la
        - echo "--- app dir ---" && ls -la app 2>/dev/null || echo "!!! app ディレクトリが存在しません !!!"
        # ── 依存インストール ──────────────────
        # package-lock.json があれば npm ci（再現性が高い）。
        # 無ければ npm install にフォールバックしてビルドを止めない。
        - if [ -f package-lock.json ]; then npm ci; else npm install; fi
    build:
      commands:
        # DATABASE_URL は Amplify コンソールの環境変数から注入されます。
        # ビルド時にDBへは接続しません（接続はリクエスト時のみ）。
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
