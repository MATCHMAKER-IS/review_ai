version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # DATABASE_URL などは Amplify コンソールの環境変数から注入されます。
        # ビルド時にはDBへ接続しません（接続はリクエスト時のみ）。
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
