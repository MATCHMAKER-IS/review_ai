version: 1
frontend:
  phases:
    preBuild:
      commands:
        - if [ -f package-lock.json ]; then npm ci; else npm install; fi
    build:
      commands:
        # ── 環境変数を実行時(Lambda)へ渡す ──────────────────
        # Amplify コンソールの環境変数は「ビルド時」には見えますが、
        # Next.js SSR の「実行時(Lambda)」には自動では渡りません。
        # ここで .env.production に書き出しておくと、next build が
        # サーバー用バンドルに取り込み、実行時にも process.env で
        # 読めるようになります。
        #
        # 値そのものはログに出しません（キーが漏れるため）。
        # 設定されているかどうかだけ echo で確認します。
        - echo "DATABASE_URL set? -> $([ -n \"$DATABASE_URL\" ] && echo yes || echo NO)"
        - echo "OPENAI_API_KEY set? -> $([ -n \"$OPENAI_API_KEY\" ] && echo yes || echo NO)"
        - echo "HOOK_SECRET set? -> $([ -n \"$HOOK_SECRET\" ] && echo yes || echo NO)"
        - env | grep -E '^(DATABASE_URL|OPENAI_API_KEY|OPENAI_MODEL|HOOK_SECRET|PG_POOL_MAX|BASIC_AUTH_USER|BASIC_AUTH_PASS)=' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
